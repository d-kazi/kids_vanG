name: iOS

# Runs on GitHub's macOS runners. Only exercises the pure-Swift DrawingEngine
# package (kept as a reference / future engine). The app target was removed
# when the active implementation pivoted to web (see web/).
on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

jobs:
  engine-tests:
    name: DrawingEngine unit tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: swift test
        working-directory: ios/DrawingEngine
        run: swift test
