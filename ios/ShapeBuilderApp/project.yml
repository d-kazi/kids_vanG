name: ShapeBuilder
options:
  bundleIdPrefix: com.kidsvang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  DrawingEngine:
    path: ../DrawingEngine

targets:
  ShapeBuilder:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    dependencies:
      - package: DrawingEngine
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Shape Builder
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.kidsvang.shapebuilder

schemes:
  ShapeBuilder:
    build:
      targets:
        ShapeBuilder: all
    run:
      config: Debug
    test:
      config: Debug
